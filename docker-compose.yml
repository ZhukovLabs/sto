services:
  db:
    image: postgres:18-alpine
    container_name: sto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sto
      POSTGRES_PASSWORD: sto
      POSTGRES_DB: sto
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - sto-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sto -d sto']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:3.81
    container_name: sto-storage
    restart: unless-stopped
    command: 'server -dir=/data -ip=storage -master.volumeSizeLimitMB=2048 -s3 -s3.port=8333 -volume.max=0'
    ports:
      - '${S3_PORT:-8333}:8333'
      - '${SEAWEED_MASTER_PORT:-9333}:9333'
    volumes:
      - sto-seaweeddata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://storage:9333/cluster/status || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sto-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sto:sto@db:5432/sto
      PORT: '3002'
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      AUTH_SECRET: ${AUTH_SECRET:?задайте AUTH_SECRET (openssl rand -hex 32) в окружении или .env у корня}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PAID_CHANNELS_DAILY_LIMIT: ${PAID_CHANNELS_DAILY_LIMIT:-50}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: sto-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sto}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sto-s3-secret}
    ports:
      - '${API_PORT:-3002}:3002'
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    profiles: ['full']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sto-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    profiles: ['full']

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: sto-admin
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-3001}:3001'
    profiles: ['full']

volumes:
  sto-pgdata:
  sto-seaweeddata:
